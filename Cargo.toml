[package]
name = "grok-cli"
version = "0.3.0-prerelease"
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"
authors = ["john mcconnell john.microtech@gmail.com"]
description = "A CLI tool for interacting with Grok AI via X API"
license-file = "LICENSE"
repository = "https://github.com/micro-tech/grok-cli"
keywords = ["cli", "ai", "grok", "x-api"]
categories = ["command-line-utilities"]
exclude = [
    ".agents/**",
    ".doc/**",
    ".grok/**",
    ".zed/**",
    "Doc/ai-generated-summaries/**",
    "code_review.md",
    "dataflow_map.md",
    "session_dna.json",
    "bot_default_model .md",
    "1.png",
]

[[bin]]
name = "grok-cli"
path = "src/main.rs"

[[bin]]
name = "github_mcp"
path = "src/bin/github_mcp.rs"

[[bench]]
name = "perf_bench"
harness = false

[dependencies]
# grok_api = { path = "../grok_crate/grok_api", version = "0.2.1" }
# HTTP client with timeout support for network drops
grok_api = "0.2.1"

reqwest = { version = "0.13.4", features = [
    "json",
    "native-tls-vendored",
    "http2",
    "stream",
], default-features = false }
futures-util = "0.3"
# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CLI parsing
clap = { version = "4.6.6", features = ["derive", "env"] }
# Error handling
anyhow = "1.0"
thiserror = "2.0"
agent-client-protocol = "2.0.0"
tokio-util = { version = "0.7", features = ["compat"] }
# Environment variable loading
dotenvy = "0.15"
# Configuration
config = "0.15"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }

# Terminal colors and formatting
colored = "3.1.1"
# Progress indicators
indicatif = "0.18"
# File I/O and paths
dirs = "6.0"
# UUID generation
uuid = { version = "1.26.0", features = ["v4", "serde"] }
# TGS-RAG dependencies (gated behind "tgs-rag" feature)
tree-sitter = { version = "0.26.13", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
syn = { version = "3.0.4", features = [
    "full",
    "parsing",
    "visit",
], optional = true }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
# Base64 encoding
base64 = "0.23.1"
# Terminal utilities (using terminal_size instead)
# Random number generation for retry backoff
rand = "0.10.2"
async-trait = "0.1"
# Date and time handling for sessions
chrono = { version = "0.4", features = ["serde"] }
# Terminal size detection
terminal_size = "0.4"
# TOML configuration parsing
toml = "1.1.4"

# Terminal detection
is-terminal = "0.4"
ratatui = "0.30"
crossterm = "0.29"
glob = "0.3"
walkdir = "2"
regex = "1"
urlencoding = "2"
clap-markdown = "0.1"
serde_yaml = "0.9.34"
whoami = "2.1.3"
shellexpand = "3.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
mockito = "1.7"
tokio-test = "0.4"
serial_test = "4.0.1"
# For Task 266 benchmarks (optional but recommended for perf work)
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
# Task 272: Strong release profile for small binary + fast cold starts
opt-level = 3          # Maximum optimization (change to "z" or "s" for even smaller size if needed)
lto = "fat"            # Full link-time optimization (stronger than true in recent Rust)
codegen-units = 1      # Better optimization, longer build
panic = "abort"        # Smaller binaries (no unwinding)
strip = true           # Strip symbols (good for distribution)
debug = "none"         # Explicitly no debug info in release

# Optional "slim" profile for even smaller distribution builds
# Usage: cargo build --profile slim
[profile.slim]
inherits = "release"
opt-level = "z"        # Optimize for size
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
# Task 272: modest opt-level in dev to improve compile + run speed during development
opt-level = 1
incremental = true

[features]
default = []
tgs-rag = ["tree-sitter", "tree-sitter-rust", "syn", "quote", "proc-macro2"]
