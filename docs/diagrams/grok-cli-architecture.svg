<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grok-cli-architecture-title grok-cli-architecture-desc" id="grok-cli-architecture-root">
      <title id="grok-cli-architecture-title">grok-cli architecture and data flow</title>
      <desc id="grok-cli-architecture-desc">Agentic loop in grok-cli: the CLI feeds the agent loop, the router calls the xAI API, tool calls dispatch through the registry to local tools and MCP servers, with context and memory feeding the loop.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #grok-cli-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #grok-cli-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #grok-cli-architecture-root .diagram-container { overflow-x: auto; }</style>
        <marker id="grok-cli-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="grok-cli-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: grok-cli process (drawn before arrows and nodes) -->
      <rect x="24" y="158" width="534" height="272" rx="8"
            fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="32" y="162" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="96" y="171" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">GROK-CLI &#183; RUST CRATE</text>

      <!-- ============ Arrows (behind boxes) ============ -->
      <!-- 1. CLI -> Agent loop : REQUEST -->
      <line x1="180" y1="222" x2="216" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="166" y="202" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>

      <!-- 2. Agent loop -> CLI : OUTPUT (dashed return) -->
      <line x1="216" y1="238" x2="180" y2="238" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="166" y="246" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>

      <!-- 3. Agent loop -> Router : INFERENCE -->
      <line x1="366" y1="222" x2="402" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="342" y="202" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INFERENCE</text>

      <!-- 4. Router -> xAI API : HTTPS (link) -->
      <line x1="542" y1="222" x2="578" y2="222" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow-link)"/>
      <rect x="536" y="202" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="211" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <!-- 5. xAI API -> Agent loop : RESPONSE (over the top, link) -->
      <path d="M 640,190 V 138 H 290 V 190"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow-link)"/>
      <rect x="433" y="118" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="465" y="127" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESPONSE</text>

      <!-- 6. Agent loop -> Tool registry : TOOL CALLS -->
      <line x1="330" y1="254" x2="330" y2="310" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="338" y="274" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL CALLS</text>

      <!-- 7. Registry -> Local tools : EXECUTE -->
      <line x1="216" y1="342" x2="180" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="166" y="322" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTE</text>

      <!-- 8. Local tools -> Registry : RESULTS (dashed) -->
      <line x1="180" y1="358" x2="216" y2="358" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="166" y="366" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULTS</text>

      <!-- 9. Registry -> Context : MEMORY (dashed) -->
      <line x1="366" y1="342" x2="402" y2="342" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="352" y="322" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>

      <!-- 10. Registry -> MCP servers : MCP_CALL -->
      <path d="M 300,374 V 400 H 653 V 374"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="661" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="693" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP_CALL</text>

      <!-- 11. MCP servers -> Registry : RESULTS (dashed return) -->
      <path d="M 690,374 V 428 H 264 V 374"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#grok-cli-architecture-arrow)"/>
      <rect x="272" y="408" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULTS</text>

      <!-- ============ Nodes ============ -->
      <!-- CLI & display (input) -->
      <rect x="40" y="190" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="190" width="140" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="198" width="22" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="59" y="207" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="110" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI &amp; display</text>
      <text x="110" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clap &#183; REPL &#183; terminal UI</text>

      <!-- Agent loop (backend) -->
      <rect x="216" y="190" width="150" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="190" width="150" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="224" y="198" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="241" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="291" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent loop</text>
      <text x="291" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agentic loop &#183; planner</text>

      <!-- Router (backend) -->
      <rect x="402" y="190" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="402" y="190" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="410" y="198" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="430" y="207" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
      <text x="472" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
      <text x="472" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CpuRouter &#183; GrokBackend</text>

      <!-- xAI API (external) -->
      <rect x="578" y="190" width="150" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="578" y="190" width="150" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="586" y="198" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="600" y="207" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="653" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">xAI API</text>
      <text x="653" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.x.ai &#183; HTTPS</text>

      <!-- Local tools (backend) -->
      <rect x="40" y="310" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="310" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="318" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="68" y="327" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="110" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local tools</text>
      <text x="110" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file, shell, web, skills</text>

      <!-- Tool registry (focal) -->
      <rect x="216" y="310" width="150" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="310" width="150" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="224" y="318" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="238" y="327" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUB</text>
      <text x="291" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool registry</text>
      <text x="291" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core toolset &#183; tool_search</text>

      <!-- Context & memory (store) -->
      <rect x="402" y="310" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="402" y="310" width="140" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="410" y="318" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="430" y="327" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="472" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context &amp; memory</text>
      <text x="472" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session &#183; memory &#183; RAG</text>

      <!-- MCP servers (external) -->
      <rect x="578" y="310" width="150" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="578" y="310" width="150" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="586" y="318" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="600" y="327" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="653" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP servers</text>
      <text x="653" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">github_mcp &#183; JSON-RPC</text>

      <!-- Callout: core-toolset unlock -->
      <rect x="40" y="452" width="3" height="28" fill="#bf4520"/>
      <text x="52" y="471" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The model sees just 7 core tools per call &#8212; tool_search unlocks the rest mid-session.</text>

      <!-- Legend strip -->
      <line x1="40" y1="500" x2="1000" y2="500" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="528" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <text x="60" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tool registry &#183; focal</text>

      <rect x="180" y="528" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend / step</text>

      <rect x="300" y="528" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <text x="320" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External service</text>

      <rect x="436" y="528" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <text x="456" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store / state</text>

      <rect x="548" y="528" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <text x="568" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entry point</text>

      <line x1="656" y1="533" x2="684" y2="533" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow-link)"/>
      <text x="692" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS / API</text>

      <line x1="768" y1="533" x2="796" y2="533" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#grok-cli-architecture-arrow)"/>
      <text x="804" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Local flow</text>

      <line x1="874" y1="533" x2="902" y2="533" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#grok-cli-architecture-arrow)"/>
      <text x="910" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / async</text>
    </svg>
