<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grok-cli · Router flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }

    .back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .back a { color: var(--color-muted); text-decoration: none; }
    .back a:hover { color: var(--color-accent); text-decoration: underline; }

    .diagram-container { overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>grok-cli &mdash; router flow</h1>
    <p class="back"><a href="grok-cli-architecture.html">&larr; Back to overview</a></p>

    <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grok-cli-router-flow-title grok-cli-router-flow-desc">
      <title id="grok-cli-router-flow-title">grok-cli router flow</title>
      <desc id="grok-cli-router-flow-desc">Inference routing in grok-cli: the AppRouter TPM gate fails soft, CpuRouter dispatches by model-name prefix to GrokBackend over the vendored grok_api client, with 429 Retry-After waits and context-overflow trim-and-retry loops.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Arrows (behind boxes) ============ -->
      <!-- 1. Start -> AppRouter + CpuRouter : REQUEST -->
      <line x1="400" y1="100" x2="400" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="106" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>

      <!-- 2. Router -> GrokBackend -->
      <line x1="400" y1="184" x2="400" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 3. GrokBackend -> HTTPS request -->
      <line x1="400" y1="268" x2="400" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 4. HTTPS request -> Status diamond -->
      <line x1="400" y1="352" x2="400" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 5. Status -> Parse : 200 OK -->
      <line x1="400" y1="460" x2="400" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="466" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="475" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 OK</text>

      <!-- 6. Parse -> End -->
      <line x1="400" y1="544" x2="400" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 7. Status -> Retry-After wait : 429 -->
      <line x1="510" y1="416" x2="640" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="561" y="396" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="575" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">429</text>

      <!-- 8. Retry-After wait -> HTTPS request : RETRY (dashed loop-back) -->
      <path d="M 750,448 V 576 Q 750,584 742,584 H 568 Q 560,584 560,576 V 330 Q 560,322 568,322 H 510"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="568" y="430" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="590" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>

      <!-- 9. Status -> Trim + retry once : 400 -->
      <line x1="290" y1="416" x2="260" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="261" y="396" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="275" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">400</text>

      <!-- 10. Trim + retry once -> HTTPS request : RETRY ONCE (dashed loop-back) -->
      <path d="M 150,384 V 330 Q 150,322 158,322 H 290"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="86" y="340" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="114" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY ONCE</text>

      <!-- ============ Nodes ============ -->
      <!-- Start -->
      <ellipse cx="400" cy="76" rx="110" ry="24" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="400" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inference request</text>

      <!-- AppRouter + CpuRouter (backend) -->
      <rect x="290" y="124" width="220" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="124" width="220" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="298" y="130" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="320" y="139" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
      <text x="400" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AppRouter &#183; CpuRouter</text>
      <text x="400" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TPM fail-soft &#183; prefix dispatch</text>

      <!-- GrokBackend (focal) -->
      <rect x="290" y="208" width="220" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="208" width="220" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="298" y="214" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="324" y="223" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text>
      <text x="400" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GrokBackend</text>
      <text x="400" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vendored grok_api 0.2.4</text>

      <!-- HTTPS request (backend) -->
      <rect x="290" y="292" width="220" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="292" width="220" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="298" y="298" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="318" y="307" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>
      <text x="400" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTPS request</text>
      <text x="400" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.x.ai &#183; GROK_API_KEY</text>

      <!-- Status decision -->
      <polygon points="400,372 510,416 400,460 290,416" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP status?</text>

      <!-- Parse response (backend) -->
      <rect x="290" y="484" width="220" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="290" y="484" width="220" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="298" y="490" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="318" y="499" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>
      <text x="400" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse response</text>
      <text x="400" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">extract tool_calls</text>

      <!-- End -->
      <ellipse cx="400" cy="600" rx="110" ry="24" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="400" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tool_calls out</text>

      <!-- Retry-After wait (backend) -->
      <rect x="640" y="384" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="384" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="390" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="668" y="399" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
      <text x="750" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retry-After wait</text>
      <text x="750" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">429 &#183; wait up to 60 s</text>

      <!-- Trim + retry once (backend) -->
      <rect x="40" y="384" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="384" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="390" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="68" y="399" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
      <text x="150" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trim + retry once</text>
      <text x="150" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never system &#183; never last turn</text>

      <!-- Legend strip -->
      <line x1="40" y1="664" x2="1240" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <ellipse cx="52" cy="692" rx="12" ry="7" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="70" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="150" y="686" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="170" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="232,684 244,692 232,700 220,692" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="322" y="686" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="342" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal (vendored)</text>

      <line x1="452" y1="692" x2="480" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="488" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

      <line x1="540" y1="692" x2="568" y2="692" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="576" y="695" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retry loop</text>
    </svg>
    </div>
  </div>
</body>
</html>
